spring:
  datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${local-db.postgres.host}:${local-db.postgres.port}/${local-db.postgres.name}
      username: ${local-db.postgres.username}
      password: ${local-db.postgres.password}

  jpa:
    properties:
      hibernate:
        format:
            sql: true
        highlight:
            sql: true
        hbm2ddl:
            auto: create
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: true
  
  data:
    redis:
      host: ${local-db.redis.host}
      port: ${local-db.redis.port}
      timeout: ${local-db.redis.timeout}
      lettuce:
        pool:
          max-active: ${local-db.redis.max-active}
          max-idle: ${local-db.redis.max-idle}
          min-idle: ${local-db.redis.min-idle}
  
  ai:
    openai:
      api-key: ${local-ai.openai.api-key}
      chat:
        options:
          model: ${local-ai.openai.chat.options.model}
          temperature: ${local-ai.openai.chat.options.temperature}

      
    anthropic:
      claude:
        api-key: ${local-ai.anthropic.claude.api-key}
        chat:
          options:
            model: ${local-ai.anthropic.claude.chat.options.model}
            temperature: ${local-ai.anthropic.claude.chat.options.temperature}
    
    vertex:
      ai:
        gemini:
          project-id: ${local-ai.vertex.ai.gemini.project-id}
          location: ${local-ai.vertex.ai.gemini.location}
          chat:
            options:
              model: ${local-ai.vertex.ai.gemini.chat.options.model}
              temperature: ${local-ai.vertex.ai.gemini.chat.options.temperature}

session:
  expiration-hours: 24
  max-sessions-per-user: 5

websocket:
  security:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:3001"
    csrf-protection: false

logging:
  level:
    org:
      hibernate:
        type: info
        level: info
