spring:
  datasource:
      driver-class-name: org.postgresql.Driver
      url: jdbc:postgresql://${local-db.postgres.host}:${local-db.postgres.port}/${local-db.postgres.name}
      username: ${local-db.postgres.username}
      password: ${local-db.postgres.password}

  jpa:
    properties:
      hibernate:
        format:
            sql: true
        highlight:
            sql: true
        hbm2ddl:
            auto: create
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: true
  
  data:
    redis:
      host: ${local-db.redis.host}
      port: ${local-db.redis.port}
      timeout: ${local-db.redis.timeout}
      lettuce:
        pool:
          max-active: ${local-db.redis.max-active}
          max-idle: ${local-db.redis.max-idle}
          min-idle: ${local-db.redis.min-idle}
  
  session:
    store-type: redis
    redis:
        namespace: spring:session

session:
  expiration-hours: 24
  max-sessions-per-user: 5

websocket:
  security:
    allowed-origins:
      - "http://localhost:3000"
      - "http://localhost:3001"
      - "http://127.0.0.1:3000"
      - "http://127.0.0.1:3001"
    csrf-protection: false

logging:
  level:
    org:
      hibernate:
        type: info
        level: info
